  /* Subtle Violet & Indigo Accents */
  --violet-50: #f5f3ff;
  --violet-100: #ede9fe;
  --violet-200: #ddd6fe;
  --violet-400: #a78bfa;
  --violet-500: #8b5cf6;
  --violet-600: #7c3aed;
  --violet-700: #6d28d9;
  --gradient-brand: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #7c3aed 100%);

  /* Status Colors */
  --success: #10b981;
  --success-bg: #ecfdf5;
  --success-border: #a7f3d0;
  --warning: #f59e0b;
  --warning-bg: #fffbeb;
  --warning-border: #fde68a;
  --danger: #ef4444;
  --danger-bg: #fef2f2;
  --danger-border: #fecaca;

  --info-border: #bae6fd;

  --shadow-xs: 0 1px 2px 0 rgba(9, 18, 44, 0.04);
  --shadow-sm: 0 1px 3px 0 rgba(9, 18, 44, 0.06), 0 1px 2px -1px rgba(9, 18, 44, 0.04);
  --shadow-md: 0 4px 8px -2px rgba(9, 18, 44, 0.06), 0 2px 4px -2px rgba(9, 18, 44, 0.04);

  --shadow-xl: 0 24px 36px -8px rgba(9, 18, 44, 0.12), 0 8px 16px -4px rgba(9, 18, 44, 0.04);

  --shadow-xl: 0 24px 44px -8px rgba(0, 0, 0, 0.7);
  --shadow-glow: 0 0 28px rgba(59, 130, 246, 0.35);
  --shadow-violet-glow: 0 0 28px rgba(139, 92, 246, 0.35);
}

/* Base Reset & Core Typography */
*, *::before, *::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
  text-rendering: optimizeLegibility;
}

body {
  margin: 0;
  padding: 0;
  font-family: var(--font-sans);
  background-color: var(--bg-body);
  color: var(--text-main);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  transition: background-color 0.25s ease, color 0.25s ease;
  overflow-x: hidden;
}

/* Glassmorphism Classes */
.glass-panel {
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border-color);
}
.dark .glass-panel {
  background: rgba(10, 18, 40, 0.85);
  border: 1px solid var(--border-color);
}

.glass-nav {
  background: rgba(255, 255, 255, 0.94);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border-color);
}
.dark .glass-nav {
  background: rgba(6, 11, 24, 0.94);
  border-bottom: 1px solid var(--border-color);
}

/* Custom Scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 9999px;
}
.dark ::-webkit-scrollbar-thumb {
  background: #25375d;
}
::-webkit-scrollbar-thumb:hover {
  background: #94a3b8;
}

/* Button & Micro-Interactions */
.btn-primary {
  background: linear-gradient(135deg, var(--primary-600) 0%, #1e40af 100%);
  color: #ffffff;
  font-weight: 600;
  border-radius: var(--radius-md);
  box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  transition: all 0.22s cubic-bezier(0.16, 1, 0.3, 1);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  cursor: pointer;
  border: none;
}
.btn-primary:hover {
  background: linear-gradient(135deg, var(--primary-500) 0%, var(--primary-600) 100%);
  transform: translateY(-1.5px);
  box-shadow: var(--shadow-glow);
}
.btn-primary:active {
  transform: translateY(1px) scale(0.98);
}

.btn-secondary {
  background: var(--bg-surface);
  color: var(--text-main);
  border: 1px solid var(--border-color);
  font-weight: 600;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-xs);
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  cursor: pointer;
}
.btn-secondary:hover {
  background: var(--bg-subtle);
  border-color: var(--primary-400);
  color: var(--primary-600);
  transform: translateY(-1.5px);
  box-shadow: var(--shadow-sm);
}
.btn-secondary:active {
  transform: translateY(1px);
}

.btn-violet {
  background: linear-gradient(135deg, var(--violet-600) 0%, #4f46e5 100%);
  color: #ffffff;
  font-weight: 600;
  border-radius: var(--radius-md);
  box-shadow: 0 2px 6px rgba(124, 58, 237, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.18);
  transition: all 0.22s ease;
}
.btn-violet:hover {
  background: linear-gradient(135deg, var(--violet-500) 0%, var(--violet-600) 100%);
  transform: translateY(-1.5px);
  box-shadow: var(--shadow-violet-glow);
}

/* Card Transitions & Elevations */
.edu-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-color);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-sm);
  transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}
.edu-card:hover {
  box-shadow: var(--shadow-lg);
  border-color: var(--primary-200);
}
.dark .edu-card:hover {
  border-color: #263b6d;
}

.edu-card-interactive {
  cursor: pointer;
}
.edu-card-interactive:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-xl);
}

/* Metric / Stat Card Highlights */
.stat-card {
  position: relative;
  overflow: hidden;
}
.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: var(--stat-accent, var(--primary-600));
}

/* Smooth Page Transitions */
.page-view {
  animation: pageFadeIn 0.26s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}
@keyframes pageFadeIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* Floating Animation */
@keyframes floatSlow {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
}
.animate-float-slow {
  animation: floatSlow 4s ease-in-out infinite;
}

/* Skeleton Loading Animation */
.skeleton {
  background: linear-gradient(90deg, var(--bg-subtle) 25%, var(--border-color) 50%, var(--bg-subtle) 75%);
  background-size: 200% 100%;
  animation: skeletonPulse 1.6s infinite ease-in-out;
  border-radius: var(--radius-sm);
}
@keyframes skeletonPulse {
  0% {
    background-position: 200% 0;
  }
  100% {
    background-position: -200% 0;
  }
}

/* Certificate Styles */
.certificate-frame {
  border: 12px double #1e3a8a;
  background: #ffffff;
  color: #0f172a;
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
  position: relative;
  overflow: hidden;
}
.dark .certificate-frame {
  background: #0a1228;
  color: #f8fafc;
  border: 12px double #3b82f6;
}
.certificate-watermark {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) rotate(-30deg);
  font-size: 7.5rem;
  font-weight: 900;
  opacity: 0.035;
  pointer-events: none;
  white-space: nowrap;
  letter-spacing: 0.2em;
}

/* Toast Notifications */
.toast-container {
  position: fixed;
  bottom: 24px;
  right: 24px;
  z-index: 9999;
  display: flex;
  flex-direction: column;
  gap: 12px;
  max-width: 380px;
  width: calc(100% - 48px);
  pointer-events: none;
}
.toast-item {
  pointer-events: auto;
  animation: toastSlideIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  box-shadow: var(--shadow-xl);
}
@keyframes toastSlideIn {
  from {
    opacity: 0;
    transform: translateY(16px) scale(0.95);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

/* Floating Quick Switcher Pill */
.role-pill {
  position: fixed;
  bottom: 24px;
  left: 24px;
  z-index: 999;
  backdrop-filter: blur(14px);
  border: 1px solid var(--border-color);
  box-shadow: var(--shadow-xl);
}

/* Video Player Aspect Container */
.video-container {
  position: relative;
  width: 100%;
  padding-top: 56.25%; /* 16:9 Aspect Ratio */
  background: #000;
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.video-container video,
.video-container iframe {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  border: none;
}

/* Badges */
.badge-blue {
  background-color: var(--primary-50);
  color: var(--primary-700);
  border: 1px solid var(--primary-200);
}
.dark .badge-blue {
  background-color: var(--primary-50);
  color: var(--primary-400);
  border-color: #1e3a6c;
}

.badge-violet {
  background-color: var(--violet-50);
  color: var(--violet-700);
  border: 1px solid var(--violet-200);
}
.dark .badge-violet {
  background-color: var(--violet-50);
  color: var(--violet-400);
  border-color: #381e6c;
}

/* Gradient mesh background */
.hero-glow-bg {
  background: radial-gradient(circle at 50% 20%, rgba(37, 99, 235, 0.18) 0%, rgba(124, 58, 237, 0.08) 40%, transparent 75%);
}

/* Print Styles */
@media print {
  body {
    background: #fff !important;
    color: #000 !important;
  }
  .no-print, header, aside, .role-pill, .toast-container {
    display: none !important;
  }
  .certificate-frame {
    box-shadow: none !important;
    border-width: 6px !important;
  }
}

  <script>
/**
 * EduNova LMS - Database Layer (db.js)
 * High-performance, reactive persistence store powered by localStorage.
 * Includes complete schema validation, relationships, and transactional updates.
 */

const DB = (() => {
  const STORAGE_KEY = "edunova_lms_db_v1";

  // Helper: Deep clone
  const clone = (obj) => JSON.parse(JSON.stringify(obj));

  // Initialize store
  function init() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      resetToSeed();
    }
  }

  function resetToSeed() {
    if (typeof SEED_DATA !== "undefined") {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(SEED_DATA));
    }
  }

  function read() {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) {
      resetToSeed();
      return clone(SEED_DATA);
    }
    try {
      return JSON.parse(raw);
    } catch (e) {
      console.error("Corrupted DB in storage, restoring seed data.", e);
      resetToSeed();
      return clone(SEED_DATA);
    }
  }

  function write(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    // Dispatch custom event for reactive UI updates
    window.dispatchEvent(new CustomEvent("edunova_db_change", { detail: { timestamp: Date.now() } }));
  }

  // Generate unique IDs
  function genId(prefix = "id") {
    return `${prefix}-${Date.now().toString(36)}-${Math.random().toString(36).substr(2, 5)}`;
  }

  return {
    init,
    resetToSeed,
    genId,

    // ==========================================
    // USERS
    // ==========================================
    getUsers() {
      const db = read();
      return db.users || [];
    },

    getUser(id) {
      const users = this.getUsers();
      return users.find((u) => u.id === id) || null;
    },

    getUserByEmail(email) {
      const users = this.getUsers();
      return users.find((u) => u.email.toLowerCase() === (email || "").toLowerCase()) || null;
    },

    createUser(userData) {
      const db = read();
      const existing = (db.users || []).find((u) => u.email.toLowerCase() === userData.email.toLowerCase());
      if (existing) {
        throw new Error("An account with this email address already exists.");
      }
      const newUser = {
        id: genId("u"),
        status: "active",
        joinedDate: new Date().toISOString().split("T")[0],
        avatar: userData.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(userData.name)}&background=2563eb&color=fff`,
        ...userData
      };
      db.users = db.users || [];
      db.users.push(newUser);
      write(db);
      return newUser;
    },

    updateUser(id, updates) {
      const db = read();
      const idx = (db.users || []).findIndex((u) => u.id === id);
      if (idx === -1) throw new Error("User not found.");
      db.users[idx] = { ...db.users[idx], ...updates };
      write(db);
      return db.users[idx];
    },

    deleteUser(id) {
      const db = read();
      db.users = (db.users || []).filter((u) => u.id !== id);
      write(db);
      return true;
    },

    // ==========================================
    // COURSES
    // ==========================================
    getCourses() {
      const db = read();
      return db.courses || [];
    },

    getCourse(id) {
      const courses = this.getCourses();
      return courses.find((c) => c.id === id) || null;
    },

    createCourse(courseData) {
      const db = read();
      const newCourse = {
        id: genId("crs"),
        code: `CRS-${Math.floor(100 + Math.random() * 900)}`,
        rating: 5.0,
        reviewsCount: 0,
        enrolledCount: 0,
        isPublished: true,
        chapters: [],
        outcomes: [],
        thumbnail: courseData.thumbnail || "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=800&auto=format&fit=crop&q=80",
        ...courseData
      };
      db.courses = db.courses || [];
      db.courses.unshift(newCourse);
      write(db);
      return newCourse;
    },

    updateCourse(id, updates) {
      const db = read();
      const idx = (db.courses || []).findIndex((c) => c.id === id);
      if (idx === -1) throw new Error("Course not found.");
      db.courses[idx] = { ...db.courses[idx], ...updates };
      write(db);
      return db.courses[idx];
    },

    deleteCourse(id) {
      const db = read();
      db.courses = (db.courses || []).filter((c) => c.id !== id);
      // Clean up enrollments
      db.enrollments = (db.enrollments || []).filter((e) => e.courseId !== id);
      write(db);
      return true;
    },

    addChapter(courseId, chapterData) {
      const db = read();
      const course = (db.courses || []).find((c) => c.id === courseId);
      if (!course) throw new Error("Course not found");
      course.chapters = course.chapters || [];
      const newChapter = {
        id: genId("ch"),
        order: course.chapters.length + 1,
        lessons: [],
        ...chapterData
      };
      course.chapters.push(newChapter);
      write(db);
      return newChapter;
    },

    addLesson(courseId, chapterId, lessonData) {
      const db = read();
      const course = (db.courses || []).find((c) => c.id === courseId);
      if (!course) throw new Error("Course not found");
      const chapter = (course.chapters || []).find((ch) => ch.id === chapterId);
      if (!chapter) throw new Error("Chapter not found");
      chapter.lessons = chapter.lessons || [];
      const newLesson = {
        id: genId("les"),
        type: "video",
        videoUrl: lessonData.videoUrl || "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
        resources: [],
        ...lessonData
      };
      chapter.lessons.push(newLesson);
      write(db);
      return newLesson;
    },

    // ==========================================
    // ENROLLMENTS & PROGRESS
    // ==========================================
    getEnrollments() {
      const db = read();
      return db.enrollments || [];
    },

    getUserEnrollments(userId) {
      const enrollments = this.getEnrollments();
      return enrollments.filter((e) => e.userId === userId);
    },

    getCourseEnrollments(courseId) {
      const enrollments = this.getEnrollments();
      return enrollments.filter((e) => e.courseId === courseId);
    },

    enrollStudent(userId, courseId) {
      const db = read();
      db.enrollments = db.enrollments || [];
      const existing = db.enrollments.find((e) => e.userId === userId && e.courseId === courseId);
      if (existing) return existing;

      const newEnrollment = {
        id: genId("enr"),
        userId,
        courseId,
        enrolledAt: new Date().toISOString().split("T")[0],
        completedLessons: [],
        progress: 0,
        status: "in-progress",
        notes: {}
      };
      db.enrollments.push(newEnrollment);

      // Increment course enrolled count
      const course = (db.courses || []).find((c) => c.id === courseId);
      if (course) {
        course.enrolledCount = (course.enrolledCount || 0) + 1;
      }

      write(db);
      return newEnrollment;
    },

    unenrollStudent(userId, courseId) {
      const db = read();
      db.enrollments = (db.enrollments || []).filter((e) => !(e.userId === userId && e.courseId === courseId));
      const course = (db.courses || []).find((c) => c.id === courseId);
      if (course && course.enrolledCount > 0) {
        course.enrolledCount -= 1;
      }
      write(db);
      return true;
    },

    markLessonCompleted(userId, courseId, lessonId) {
      const db = read();
      const enrollment = (db.enrollments || []).find((e) => e.userId === userId && e.courseId === courseId);
      if (!enrollment) return null;

      enrollment.completedLessons = enrollment.completedLessons || [];
      const hasCompleted = enrollment.completedLessons.includes(lessonId);

      if (hasCompleted) {
        // Toggle off
        enrollment.completedLessons = enrollment.completedLessons.filter((id) => id !== lessonId);
      } else {
        // Add
        enrollment.completedLessons.push(lessonId);
      }

      // Calculate total lessons in course
      const course = (db.courses || []).find((c) => c.id === courseId);
      let totalLessons = 0;
      if (course && course.chapters) {
        course.chapters.forEach((ch) => {
          totalLessons += (ch.lessons || []).length;
        });
      }

      if (totalLessons > 0) {
        enrollment.progress = Math.min(100, Math.round((enrollment.completedLessons.length / totalLessons) * 100));
      } else {
        enrollment.progress = 0;
      }

      if (enrollment.progress === 100) {
        enrollment.status = "completed";
        enrollment.completedAt = new Date().toISOString().split("T")[0];
        if (!enrollment.certificateId) {
          enrollment.certificateId = `CERT-EDU-2026-${Math.floor(1000 + Math.random() * 9000)}`;
        }
      } else {
        enrollment.status = "in-progress";
      }

      write(db);
      return enrollment;
    },

    saveLessonNote(userId, courseId, lessonId, noteText) {
      const db = read();
      const enrollment = (db.enrollments || []).find((e) => e.userId === userId && e.courseId === courseId);
      if (!enrollment) return null;

      enrollment.notes = enrollment.notes || {};
      enrollment.notes[lessonId] = noteText;
      write(db);
      return enrollment.notes[lessonId];
    },

    // ==========================================
    // ASSIGNMENTS & SUBMISSIONS
    // ==========================================
    getAssignments() {
      const db = read();
      return db.assignments || [];
    },

    getAssignment(id) {
      const assignments = this.getAssignments();
      return assignments.find((a) => a.id === id) || null;
    },

    createAssignment(assignmentData) {
      const db = read();
      const newAsg = {
        id: genId("asg"),
        status: "active",
        submissionsCount: 0,
        ...assignmentData
      };
      db.assignments = db.assignments || [];
      db.assignments.unshift(newAsg);
      write(db);
      return newAsg;
    },

    updateAssignment(id, updates) {
      const db = read();
      const idx = (db.assignments || []).findIndex((a) => a.id === id);
      if (idx === -1) throw new Error("Assignment not found");
      db.assignments[idx] = { ...db.assignments[idx], ...updates };
      write(db);
      return db.assignments[idx];
    },

    deleteAssignment(id) {
      const db = read();
      db.assignments = (db.assignments || []).filter((a) => a.id !== id);
      db.submissions = (db.submissions || []).filter((s) => s.assignmentId !== id);
      write(db);
      return true;
    },

    getSubmissions() {
      const db = read();
      return db.submissions || [];
    },

    getAssignmentSubmissions(assignmentId) {
      const subs = this.getSubmissions();
      return subs.filter((s) => s.assignmentId === assignmentId);
    },

    getStudentSubmissions(studentId) {
      const subs = this.getSubmissions();
      return subs.filter((s) => s.studentId === studentId);
    },

    submitAssignment(subData) {
      const db = read();
      db.submissions = db.submissions || [];
      // Check if student already submitted this assignment
      const existingIdx = db.submissions.findIndex(
        (s) => s.assignmentId === subData.assignmentId && s.studentId === subData.studentId
      );

      const submission = {
        id: existingIdx >= 0 ? db.submissions[existingIdx].id : genId("sub"),
        submittedAt: new Date().toISOString(),
        status: "submitted",
        grade: null,
        feedback: null,
        gradedBy: null,
        gradedAt: null,
        ...subData
      };

      if (existingIdx >= 0) {
        db.submissions[existingIdx] = submission;
      } else {
        db.submissions.unshift(submission);
        // increment assignment submission count
        const asg = (db.assignments || []).find((a) => a.id === subData.assignmentId);
        if (asg) {
          asg.submissionsCount = (asg.submissionsCount || 0) + 1;
        }
      }

      write(db);
      return submission;
    },

    gradeSubmission(subId, grade, feedback, teacherId) {
      const db = read();
      const sub = (db.submissions || []).find((s) => s.id === subId);
      if (!sub) throw new Error("Submission not found");

      sub.grade = Number(grade);
      sub.feedback = feedback;
      sub.status = "graded";
      sub.gradedBy = teacherId;
      sub.gradedAt = new Date().toISOString();

      // Add notification to student
      this.addNotification({
        userId: sub.studentId,
        title: "Assignment Graded",
        message: `Your assignment submission was graded: ${grade}/100.`,
        type: "grade",
        link: "#assignments"
      });

      write(db);
      return sub;
    },

    getQuizzes() {
      const db = read();
      return db.quizzes || [];
    },

    getQuiz(id) {
      const quizzes = this.getQuizzes();
      return quizzes.find((q) => q.id === id) || null;

    createQuiz(quizData) {
      const db = read();
      const newQuiz = {
        id: genId("qz"),
        questionsCount: (quizData.questions || []).length,
        ...quizData
      };
      db.quizzes = db.quizzes || [];
      db.quizzes.unshift(newQuiz);
      write(db);
      return newQuiz;

    updateQuiz(id, updates) {

      const idx = (db.quizzes || []).findIndex((q) => q.id === id);
      if (idx === -1) throw new Error("Quiz not found");
      db.quizzes[idx] = { ...db.quizzes[idx], ...updates };
      write(db);
      return db.quizzes[idx];
    },

    deleteQuiz(id) {

      db.quizzes = (db.quizzes || []).filter((q) => q.id !== id);
      db.quizAttempts = (db.quizAttempts || []).filter((qa) => qa.quizId !== id);

    // ==========================================

    // ==========================================
    getAnnouncements() {

      return db.announcements || [];

        ...ancData
      };
      db.announcements = db.announcements || [];
      db.announcements.unshift(newAnc);
      write(db);
      return newAnc;

    deleteAnnouncement(id) {
      const db = read();
      db.announcements = (db.announcements || []).filter((a) => a.id !== id);

      return true;
    },

    // ==========================================
    // BATCHES / CLASSES
    // ==========================================
    getBatches() {
      const db = read();
      return db.batches || [];
    },

    createBatch(batchData) {
      const db = read();
      const newBatch = {
        id: genId("batch"),
        studentsCount: 0,
        status: "active",
        ...batchData
      };
      db.batches = db.batches || [];
      db.batches.unshift(newBatch);

      db.batches[idx] = { ...db.batches[idx], ...updates };

    getDiscussions(courseId, lessonId) {

      if (courseId) list = list.filter((d) => d.courseId === courseId);

      disc.replies = disc.replies || [];
      const newReply = {

      const disc = (db.discussions || []).find((d) => d.id === discId);
      if (disc) {
        disc.upvotes = (disc.upvotes || 0) + 1;
        write(db);
        return disc.upvotes;

      return 0;
    },

    // ==========================================
    // NOTIFICATIONS
    // ==========================================
    getUserNotifications(userId) {
      const db = read();
      return (db.notifications || []).filter((n) => n.userId === userId || n.userId === "all");

    addNotification(notifData) {

      db.notifications.unshift(newNotif);
      write(db);
      return newNotif;
    },

    markNotificationRead(id) {
      const db = read();
      const notif = (db.notifications || []).find((n) => n.id === id);
      if (notif) {
        notif.read = true;
        write(db);
      }
      return true;
    },

    markAllNotificationsRead(userId) {
      const db = read();
      (db.notifications || []).forEach((n) => {
        if (n.userId === userId || n.userId === "all") {
          n.read = true;
        }
      });
      write(db);
      return true;
    },

    // ==========================================
    // BACKUP & EXPORT
    // ==========================================
    exportDatabase() {
      return JSON.stringify(read(), null, 2);
    },

    importDatabase(jsonString) {
      const parsed = JSON.parse(jsonString);
      if (!parsed.users || !parsed.courses) {
        throw new Error("Invalid EduNova database JSON schema.");
      }
      write(parsed);
      return true;
    }
  };
})();

// Auto initialize on load
DB.init();

if (typeof module !== "undefined" && module.exports) {

  <script>
/**
 * EduNova LMS - Authentication & RBAC Service (auth.js)
 * Manages user sessions, role-based authorization, demo switching, and access guards.
 */

const Auth = (() => {
  const SESSION_KEY = "edunova_current_user_v1";

  function getCurrentUser() {
    const raw = localStorage.getItem(SESSION_KEY);
    if (raw) {
      try {
        const cached = JSON.parse(raw);
        // Refresh from DB in case user data was updated
        const fresh = DB.getUser(cached.id);
        return fresh || cached;
      } catch (e) {
        console.error("Failed to parse current user session", e);
      }
    }
    // Default to Alex Morgan (Student) for immediate out-of-the-box demo exploration
    const defaultStudent = DB.getUser("u-student-1");
    if (defaultStudent) {
      setCurrentUser(defaultStudent);
      return defaultStudent;
    }
    return null;
  }

  function setCurrentUser(user) {
    if (!user) {
      localStorage.removeItem(SESSION_KEY);
    } else {
      localStorage.setItem(SESSION_KEY, JSON.stringify(user));
    }
    window.dispatchEvent(new CustomEvent("edunova_auth_change", { detail: { user } }));
  }

  function login(email, password) {
    const trimmedEmail = (email || "").trim().toLowerCase();
    const user = DB.getUserByEmail(trimmedEmail);

    if (!user) {
      throw new Error("No user found with this email address.");
    }
    if (user.password !== password) {
      throw new Error("Invalid password. Please check your credentials and try again.");
    }
    if (user.status === "inactive") {
      throw new Error("Your account has been deactivated. Please contact an administrator.");
    }

    setCurrentUser(user);
    return user;
  }

  function register(data) {
    const { name, email, password, role } = data;
    if (!name || name.trim().length < 2) {
      throw new Error("Please enter a valid full name.");
    }
    if (!email || !email.includes("@")) {
      throw new Error("Please enter a valid email address.");
    }
    if (!password || password.length < 6) {
      throw new Error("Password must be at least 6 characters long.");
    }

    const newUser = DB.createUser({
      name: name.trim(),
      email: email.trim().toLowerCase(),
      password,
      role: role || "student",
      title: role === "teacher" ? "Instructor" : "Enrolled Student",
      department: role === "teacher" ? "Faculty" : "General Studies"
    });

    setCurrentUser(newUser);
    return newUser;
  }

  function logout() {
    localStorage.removeItem(SESSION_KEY);
    window.dispatchEvent(new CustomEvent("edunova_auth_change", { detail: { user: null } }));
  }

  // Quick 1-click role switcher for seamless evaluation
  function switchRole(targetRole) {
    let targetUser = null;
    if (targetRole === "admin") {
      targetUser = DB.getUser("u-admin-1");
    } else if (targetRole === "teacher") {
      targetUser = DB.getUser("u-teacher-1");
    } else if (targetRole === "student") {
      targetUser = DB.getUser("u-student-1");
    }

    if (targetUser) {
      setCurrentUser(targetUser);
      return targetUser;
    }
    throw new Error(`Role ${targetRole} target user not found.`);
  }

  function hasRole(requiredRole) {
    const user = getCurrentUser();
    if (!user) return false;
    if (user.role === "admin") return true; // Admin has super-privilege
    return user.role === requiredRole;
  }

  function updateProfile(updates) {
    const user = getCurrentUser();
    if (!user) throw new Error("No active session");
    const updated = DB.updateUser(user.id, updates);
    setCurrentUser(updated);
    return updated;
  }

  return {
    getCurrentUser,
    setCurrentUser,
    login,
    register,
    logout,
    switchRole,
    hasRole,
    updateProfile
  };
})();

if (typeof module !== "undefined" && module.exports) {
  module.exports = Auth;
} else if (typeof window !== "undefined") {
  window.Auth = Auth;
}

  <script>
/**
 * EduNova LMS - SVG Charts Engine (charts.js)
 * High-performance, retina-sharp, theme-reactive SVG charts.
 * Supports Area charts, Bar charts, and Donut charts with tooltips and animations.
 */

const Charts = (() => {
  // Helper to escape HTML in tooltips
  const escapeHtml = (str) => String(str).replace(/[&<>'"]/g, "");

  /**
   * Render an interactive Area Chart (e.g. Monthly Enrollments, Platform Activity)
   */
  function renderAreaChart(container, options = {}) {
    const el = typeof container === "string" ? document.getElementById(container) : container;
    if (!el) return;

    const data = options.data || [
      { label: "Jun", value: 45 },
      { label: "Jul", value: 68 },
      { label: "Aug", value: 92 },
      { label: "Sep", value: 145 },
      { label: "Oct", value: 198 },
      { label: "Nov", value: 248 }
    ];

    const width = options.width || el.clientWidth || 540;
    const height = options.height || 220;
    const padding = { top: 20, right: 25, bottom: 35, left: 45 };

    const innerW = width - padding.left - padding.right;
    const innerH = height - padding.top - padding.bottom;

    const maxVal = Math.max(...data.map((d) => d.value), 10) * 1.15;
    const minVal = 0;

    const getX = (idx) => padding.left + (idx / (data.length - 1)) * innerW;
    const getY = (val) => padding.top + innerH - ((val - minVal) / (maxVal - minVal)) * innerH;

    // Build SVG Path points
    const points = data.map((d, i) => ({ x: getX(i), y: getY(d.value), ...d }));

    // Generate smooth bezier curve path
    let linePath = `M ${points[0].x} ${points[0].y}`;
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i === 0 ? 0 : i - 1];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2 < points.length ? i + 2 : i + 1];

      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;

      linePath += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    }

    const areaPath = `${linePath} L ${points[points.length - 1].x} ${padding.top + innerH} L ${points[0].x} ${padding.top + innerH} Z`;

    // Horizontal grid lines
    const gridTicks = 4;
    let gridLinesHtml = "";
    for (let i = 0; i <= gridTicks; i++) {
      const val = Math.round(minVal + (i / gridTicks) * (maxVal - minVal));
      const y = padding.top + innerH - (i / gridTicks) * innerH;
      gridLinesHtml += `
        <line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="currentColor" stroke-opacity="0.08" stroke-dasharray="3 3" />
        <text x="${padding.left - 10}" y="${y + 4}" fill="currentColor" opacity="0.45" font-size="11" text-anchor="end">${val}</text>
      `;
    }

    // X Axis labels
    const xLabelsHtml = points
      .map(
        (p) => `
        <text x="${p.x}" y="${height - 10}" fill="currentColor" opacity="0.55" font-size="11" text-anchor="middle">${p.label}</text>
      `
      )
      .join("");

    // Interactive Points
    const dotsHtml = points
      .map(
        (p, idx) => `
        <g class="chart-dot group cursor-pointer" data-label="${escapeHtml(p.label)}" data-value="${p.value}">
          <circle cx="${p.x}" cy="${p.y}" r="4.5" fill="#2563eb" stroke="#ffffff" stroke-width="2" class="transition-all duration-200 group-hover:r-6" />
          <circle cx="${p.x}" cy="${p.y}" r="14" fill="transparent" />
          <title>${p.label}: ${p.value} students</title>
        </g>
      `
      )
      .join("");

    const gradientId = `area-grad-${Math.random().toString(36).substr(2, 6)}`;

    el.innerHTML = `
      <div class="relative w-full overflow-hidden">
        <svg viewBox="0 0 ${width} ${height}" class="w-full h-auto text-slate-800 dark:text-slate-200">
          <defs>
            <linearGradient id="${gradientId}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2563eb" stop-opacity="0.38"/>
              <stop offset="70%" stop-color="#6366f1" stop-opacity="0.10"/>
              <stop offset="100%" stop-color="#2563eb" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          ${gridLinesHtml}
          <path d="${areaPath}" fill="url(#${gradientId})" />
          <path d="${linePath}" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          ${dotsHtml}
          ${xLabelsHtml}
        </svg>
      </div>
    `;
  }

  /**
   * Render a Bar Chart (e.g. Grade Distribution or Course Submissions)
   */
  function renderBarChart(container, options = {}) {
    const el = typeof container === "string" ? document.getElementById(container) : container;
    if (!el) return;

    const data = options.data || [
      { label: "A (90-100)", value: 42, color: "#2563eb" },
      { label: "B (80-89)", value: 65, color: "#3b82f6" },
      { label: "C (70-79)", value: 38, color: "#6366f1" },
      { label: "D (60-69)", value: 14, color: "#f59e0b" },
      { label: "F (<60)", value: 4, color: "#ef4444" }
    ];

    const width = options.width || el.clientWidth || 500;
    const height = options.height || 210;
    const padding = { top: 20, right: 20, bottom: 40, left: 35 };

    const innerW = width - padding.left - padding.right;
    const innerH = height - padding.top - padding.bottom;

    const maxVal = Math.max(...data.map((d) => d.value), 10) * 1.15;
    const barWidth = Math.min(42, (innerW / data.length) * 0.58);
    const step = innerW / data.length;

    let barsHtml = "";
    data.forEach((d, idx) => {
      const barH = (d.value / maxVal) * innerH;
      const x = padding.left + idx * step + (step - barWidth) / 2;
      const y = padding.top + innerH - barH;
      const color = d.color || "#2563eb";

      barsHtml += `
        <g class="chart-bar group cursor-pointer">
          <rect x="${x}" y="${y}" width="${barWidth}" height="${barH}" rx="5" ry="5" fill="${color}" fill-opacity="0.9" class="transition-all duration-200 group-hover:fill-opacity-100 group-hover:y-${y - 2}">
            <title>${d.label}: ${d.value} submissions</title>
          </rect>
          <text x="${x + barWidth / 2}" y="${y - 6}" fill="currentColor" opacity="0.8" font-size="11" font-weight="600" text-anchor="middle">${d.value}</text>
          <text x="${x + barWidth / 2}" y="${height - 12}" fill="currentColor" opacity="0.6" font-size="11" text-anchor="middle">${d.label}</text>
        </g>
      `;
    });

    // Horizontal baseline
    const baselineY = padding.top + innerH;

    el.innerHTML = `
      <div class="relative w-full overflow-hidden">
        <svg viewBox="0 0 ${width} ${height}" class="w-full h-auto text-slate-800 dark:text-slate-200">
          <line x1="${padding.left}" y1="${baselineY}" x2="${width - padding.right}" y2="${baselineY}" stroke="currentColor" stroke-opacity="0.12" stroke-width="1.5" />
          ${barsHtml}
        </svg>
      </div>
    `;
  }

  /**
   * Render a Donut Chart (e.g. Course Progress or Batch Breakdown)
   */
  function renderDonutChart(container, options = {}) {
    const el = typeof container === "string" ? document.getElementById(container) : container;
    if (!el) return;

    const segments = options.segments || [
      { label: "Completed", value: 42, color: "#10b981" },
      { label: "In Progress", value: 48, color: "#2563eb" },
      { label: "Not Started", value: 10, color: "#94a3b8" }
    ];

    const size = options.size || 180;
    const strokeWidth = 24;
    const radius = (size - strokeWidth) / 2;
    const center = size / 2;
    const circumference = 2 * Math.PI * radius;

    const total = segments.reduce((sum, s) => sum + s.value, 0) || 1;
    let accumulatedAngle = 0;

    let circlesHtml = "";
    segments.forEach((seg) => {
      const fraction = seg.value / total;
      const strokeDash = `${fraction * circumference} ${circumference}`;
      const strokeDashoffset = -accumulatedAngle * circumference;

      circlesHtml += `
        <circle cx="${center}" cy="${center}" r="${radius}" fill="none"
          stroke="${seg.color}" stroke-width="${strokeWidth}"
          stroke-dasharray="${strokeDash}" stroke-dashoffset="${strokeDashoffset}"
          class="transition-all duration-300 hover:opacity-90"
          transform="rotate(-90 ${center} ${center})">
          <title>${seg.label}: ${seg.value}%</title>
        </circle>
      `;
      accumulatedAngle += fraction;
    });

    const legendHtml = segments
      .map(
        (s) => `
        <div class="flex items-center justify-between text-xs py-1">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${s.color}"></span>
            <span class="text-slate-600 dark:text-slate-300 font-medium">${s.label}</span>
          </div>
          <span class="font-bold text-slate-800 dark:text-white tabular-nums">${s.value}%</span>
        </div>
      `
      )
      .join("");

    const centerLabel = options.centerLabel || `${segments[0].value}%`;
    const centerSub = options.centerSub || "Completed";

    el.innerHTML = `
      <div class="flex flex-col sm:flex-row items-center justify-center gap-6 py-2">
        <div class="relative w-[${size}px] h-[${size}px] flex items-center justify-center">
          <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
            <circle cx="${center}" cy="${center}" r="${radius}" fill="none" stroke="currentColor" stroke-opacity="0.08" stroke-width="${strokeWidth}" />
            ${circlesHtml}
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
            <span class="text-2xl font-black text-slate-900 dark:text-white">${centerLabel}</span>
            <span class="text-[11px] uppercase tracking-wider font-semibold text-slate-500 dark:text-slate-400">${centerSub}</span>
          </div>
        </div>
        <div class="w-full sm:w-48 flex flex-col gap-1">
          ${legendHtml}
        </div>
      </div>
    `;
  }

  return {
    renderAreaChart,
    renderBarChart,
    renderDonutChart
  };
})();

if (typeof module !== "undefined" && module.exports) {
  module.exports = Charts;
} else if (typeof window !== "undefined") {
  window.Charts = Charts;
}

    };
    toast.className = `toast-item flex items-center gap-3 px-4 py-3 rounded-xl shadow-xl border text-xs font-semibold ${colors[type] || colors.info}`;
    toast.innerHTML = `${icons[type] || icons.info}<span>${esc(message)}</span>`;

      toast.style.opacity = "0";

  // Theme Management
  function initTheme() {
    const saved = localStorage.getItem("edunova_theme") || "light";
    if (saved === "dark") {
      document.documentElement.classList.add("dark");
    } else {
      document.documentElement.classList.remove("dark");
    }
  }

  function toggleTheme() {
    const isDark = document.documentElement.classList.toggle("dark");
    localStorage.setItem("edunova_theme", isDark ? "dark" : "light");
    showToast(`Switched to ${isDark ? "Dark" : "Light"} mode`, "info");
    renderHeader();
    if (["dashboard", "admin-dashboard", "teacher-dashboard", "student-dashboard"].includes(currentRoute)) {
      renderRoute(currentRoute);
    }
  }

  // Navigation Router
  function navigate(route, params = {}) {
    window.location.hash = route;
    if (params.courseId) activeCourseId = params.courseId;
    if (params.lessonId) activeLessonId = params.lessonId;
    if (params.quizId) activeQuizId = params.quizId;
  }

  function handleRoute() {
    let hash = window.location.hash.replace(/^#\/?/, "") || "landing";
    const parts = hash.split("/");
    const rootRoute = parts[0];

    if (rootRoute === "learn" && parts[1]) {
      activeCourseId = parts[1];
      activeLessonId = parts[2] || null;
      currentRoute = "learn";
    } else if (rootRoute === "course-details" && parts[1]) {
      activeCourseId = parts[1];
      currentRoute = "course-details";
    } else {
      currentRoute = rootRoute;
    }

    renderApp();
  }

    const user = Auth.getCurrentUser();
    const isPublicPage = ["landing", "login", "register"].includes(currentRoute);

  function handleNotifClick(notifId, link) {
    DB.markNotificationRead(notifId);
    toggleNotificationsMenu();
    if (link && link.startsWith("#")) {
      navigate(link.substring(1));
    }

  function toggleMobileSidebar() {
    const drawer = document.getElementById("mobile-sidebar-drawer");
    const sidebar = document.getElementById("app-sidebar");
    if (drawer && sidebar) {
      const isHidden = drawer.classList.contains("hidden");
      if (isHidden) {
        drawer.classList.remove("hidden");
        sidebar.classList.remove("hidden");
        sidebar.classList.add("fixed", "inset-y-0", "left-0", "z-50", "flex");
      } else {
        drawer.classList.add("hidden");
        sidebar.classList.add("hidden");
        sidebar.classList.remove("fixed", "inset-y-0", "left-0", "z-50");
      }
    }
  }

  function handleGlobalSearch(term) {
    if (!term || term.trim().length < 2) return;
    if (currentRoute !== "courses") {
      navigate("courses");

    setTimeout(() => {

  function renderRoute(route) {
    const main = document.getElementById("main-content");
    if (!main) return;

    window.scrollTo({ top: 0, behavior: "smooth" });

    switch (route) {
      case "landing":
        renderLanding(main);
        break;
      case "login":
        renderLogin(main);
        break;
      case "register":
        renderRegister(main);
        break;
      case "dashboard":
        renderDashboard(main);
        break;
      case "courses":
        renderCourseCatalog(main);
        break;
      case "course-details":
        renderCourseDetails(main);
        break;
      case "learn":
        renderLessonLearning(main);
        break;
      case "assignments":
        renderAssignments(main);
        break;
      case "quizzes":
        renderQuizzes(main);
        break;
      case "batches":
        renderBatches(main);
        break;
      case "users":
        renderUsers(main);
        break;
      case "profile":
        renderProfile(main);
        break;
      case "settings":
        renderSettings(main);
        break;
      default:
        renderDashboard(main);
        break;
    }
  }

  function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById("reg-name").value;
    const email = document.getElementById("reg-email").value;
    const password = document.getElementById("reg-password").value;
    const role = document.getElementById("reg-role").value;

    try {
      const user = Auth.register({ name, email, password, role });
      showToast(`Account created successfully! Welcome, ${user.name}`, "success");
      navigate("dashboard");
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  // 4. MAIN ROLE-BASED DASHBOARD DISPATCHER
  function renderDashboard(container) {
    const user = Auth.getCurrentUser();
    if (!user) {
      navigate("login");
      return;
    }

    if (user.role === "admin") {
      renderAdminDashboard(container, user);
    } else if (user.role === "teacher") {
      renderTeacherDashboard(container, user);
    } else {
      renderStudentDashboard(container, user);
    }
  }

  // STUDENT DASHBOARD
  function renderStudentDashboard(container, user) {
    const enrollments = DB.getUserEnrollments(user.id);
    const assignments = DB.getAssignments();
    const mySubmissions = DB.getStudentSubmissions(user.id);
    const announcements = DB.getAnnouncements();

    // Find first course with unwatched lesson to continue
    let continueCourse = null;
    let continueLesson = null;
    for (const enr of enrollments) {
      const course = DB.getCourse(enr.courseId);
      if (course && course.chapters) {
        for (const ch of course.chapters) {
          for (const les of ch.lessons || []) {
            if (!enr.completedLessons.includes(les.id)) {
              continueCourse = course;
              continueLesson = les;
              break;
            }
          }
          if (continueLesson) break;
        }
      }
      if (continueLesson) break;
    }

    if (!continueCourse && enrollments.length > 0) {
      continueCourse = DB.getCourse(enrollments[0].courseId);
      if (continueCourse && continueCourse.chapters && continueCourse.chapters[0]) {
        continueLesson = continueCourse.chapters[0].lessons[0];
      }
    }

    let totalCompletedLessons = 0;
    enrollments.forEach((e) => (totalCompletedLessons += (e.completedLessons || []).length));

    container.innerHTML = `

  function filterByCategory(category, btn) {
    activeCatalogCategory = category;
    document.querySelectorAll(".category-pill").forEach((p) => {
      p.className = "category-pill px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-[var(--bg-subtle)] text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-800";
    });
    if (btn) {
      btn.className = "category-pill px-4 py-1.5 rounded-full text-xs font-bold transition-all bg-blue-600 text-white shadow-sm";
    }
    filterCoursesCatalog();
  }

  function filterCoursesCatalog() {
    const search = (document.getElementById("course-search-input")?.value || "").toLowerCase();
    const level = document.getElementById("course-level-filter")?.value || "All";
    const grid = document.getElementById("catalog-courses-grid");
    if (!grid) return;

    let list = DB.getCourses();

    if (activeCatalogCategory !== "All") {
      list = list.filter((c) => c.category === activeCatalogCategory);
    }
    if (level !== "All") {
      list = list.filter((c) => c.level === level);
    }
    if (search.trim()) {
      list = list.filter(
        (c) => c.title.toLowerCase().includes(search) || c.description.toLowerCase().includes(search) || c.category.toLowerCase().includes(search)
      );
    }

    if (list.length === 0) {
      grid.innerHTML = `<div class="col-span-3 edu-card p-12 text-center text-xs text-slate-400">No courses match your filter criteria. Try adjusting your search term.</div>`;
    } else {
      grid.innerHTML = list.map((c) => App.renderCourseCardHtml(c)).join("");
    }
  }

    const user = Auth.getCurrentUser();
    if (user) {
      const enr = DB.markLessonCompleted(user.id, courseId, lessonId);
      if (enr.progress === 100) {
        showToast("🎉 Congratulations! You have fully completed this course and earned your Verified Certificate!", "success");

        showToast("Lesson progress updated", "info");
      }
      renderLessonLearning(document.getElementById("main-content"));
    }

  let noteTimeout = null;
  function saveNoteAuto(courseId, lessonId, note) {
    const user = Auth.getCurrentUser();
    if (!user) return;
    const status = document.getElementById("note-save-status");
    if (status) status.innerText = "Saving note...";

    clearTimeout(noteTimeout);
    noteTimeout = setTimeout(() => {
      DB.saveLessonNote(user.id, courseId, lessonId, note);
      if (status) status.innerText = "All notes saved securely.";
    }, 600);
  }

  function switchLearnTab(tab) {
    document.querySelectorAll(".learn-tab-btn").forEach((b) => {
      b.className = "learn-tab-btn font-bold text-xs text-slate-400 hover:text-slate-700 pb-2";
    });
    document.querySelectorAll(".learn-tab-pane").forEach((p) => p.classList.add("hidden"));

    const btn = document.getElementById(`tab-btn-${tab}`);
    const pane = document.getElementById(`tab-pane-${tab}`);
    if (btn) btn.className = "learn-tab-btn font-bold text-xs text-blue-600 pb-2 border-b-2 border-blue-600";
    if (pane) pane.classList.remove("hidden");
  }

  function postComment(courseId, lessonId) {
    const user = Auth.getCurrentUser();
    const input = document.getElementById("new-comment-input");
    if (!user || !input || !input.value.trim()) return;

    DB.addDiscussion({
      courseId,
      lessonId,
      authorId: user.id,
      authorName: user.name,
      authorAvatar: user.avatar,
      authorRole: user.role,
      text: input.value.trim()
    });

    input.value = "";
    showToast("Comment posted", "success");
    renderLessonLearning(document.getElementById("main-content"));
    switchLearnTab("discussion");

  // QUIZ ENGINE MODAL
  function startQuiz(quizId) {
    const quiz = DB.getQuiz(quizId);
    if (!quiz) return;

    activeQuizId = quizId;
    quizTimeRemaining = quiz.timeLimitMinutes * 60;
    quizUserAnswers = {};

    let modal = document.getElementById("quiz-engine-modal");
    if (!modal) {
      modal = document.createElement("div");
      modal.id = "quiz-engine-modal";
      modal.className = "fixed inset-0 z-50 bg-black/75 backdrop-blur-md flex items-center justify-center p-4";
      document.body.appendChild(modal);
    }

    modal.classList.remove("hidden");
    renderQuizEngineContent(quiz);

    clearInterval(quizTimerInterval);
    quizTimerInterval = setInterval(() => {
      quizTimeRemaining--;
      const timerEl = document.getElementById("quiz-timer-display");
      if (timerEl) {
        const mins = Math.floor(quizTimeRemaining / 60);
        const secs = quizTimeRemaining % 60;
        timerEl.innerText = `${mins}:${secs < 10 ? "0" : ""}${secs}`;
      }
      if (quizTimeRemaining <= 0) {
        clearInterval(quizTimerInterval);
        showToast("Time expired! Automatically submitting your quiz.", "warning");
        submitQuizAnswers();
      }
    }, 1000);
  }

  function renderQuizEngineContent(quiz) {
    const modal = document.getElementById("quiz-engine-modal");
    if (!modal) return;

    const questionsHtml = (quiz.questions || [])
      .map(
        (q, qIdx) => `
        <div class="edu-card p-5 space-y-3">
          <div class="text-xs font-bold text-blue-600">Question ${qIdx + 1} of ${(quiz.questions || []).length}</div>
          <h4 class="text-sm font-bold text-[var(--text-main)]">${esc(q.question)}</h4>
          <div class="space-y-2 pt-1">
            ${(q.options || [])
              .map(
                (opt, oIdx) => `
              <label class="flex items-center gap-3 p-3 rounded-xl border border-[var(--border-color)] hover:bg-[var(--bg-subtle)] cursor-pointer text-xs transition-colors">
                <input type="radio" name="question-${q.id}" value="${oIdx}" onchange="App.recordQuizAnswer('${q.id}', ${oIdx})" class="accent-blue-600 w-4 h-4">
                <span class="text-[var(--text-main)] font-medium">${esc(opt)}</span>
              </label>
            `
              )
              .join("")}
          </div>
        </div>
      `
      )
      .join("");

    modal.innerHTML = `
      <div class="w-full max-w-2xl bg-[var(--bg-surface)] border border-[var(--border-color)] rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
        <div class="p-5 border-b border-[var(--border-color)] bg-[var(--bg-subtle)] flex items-center justify-between">
          <div>
            <span class="text-[10px] font-bold uppercase tracking-wider text-blue-600">${quiz.courseTitle}</span>
            <h2 class="text-base font-black text-[var(--text-main)]">${esc(quiz.title)}</h2>
          </div>
          <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-blue-100 dark:bg-blue-950 text-blue-700 dark:text-blue-300 font-mono font-bold text-sm">
            <span>⏱️</span>
            <span id="quiz-timer-display">${quiz.timeLimitMinutes}:00</span>
          </div>
        </div>
        <div class="p-6 overflow-y-auto space-y-6 flex-1">
          ${questionsHtml}
        </div>
        <div class="p-4 border-t border-[var(--border-color)] bg-[var(--bg-surface)] flex items-center justify-between">
          <button onclick="App.cancelQuiz()" class="btn-secondary px-4 py-2 text-xs font-bold">Cancel</button>
          <button onclick="App.submitQuizAnswers()" class="btn-primary px-6 py-2.5 text-xs font-bold">Submit Answers &rarr;</button>
        </div>
      </div>
    `;
  }

  function recordQuizAnswer(qId, optionIdx) {
    quizUserAnswers[qId] = optionIdx;
  }

  function cancelQuiz() {
    if (confirm("Are you sure you want to exit? Your answers will not be saved.")) {
      clearInterval(quizTimerInterval);
      document.getElementById("quiz-engine-modal")?.classList.add("hidden");
    }
  }

  function submitQuizAnswers() {
    clearInterval(quizTimerInterval);
    const quiz = DB.getQuiz(activeQuizId);
    const user = Auth.getCurrentUser();
    if (!quiz || !user) return;

    let correctCount = 0;
    const questions = quiz.questions || [];

    questions.forEach((q) => {
      const selected = quizUserAnswers[q.id];
      if (selected !== undefined && selected === q.correctIndex) {
        correctCount++;
      }
    });

    const score = Math.round((correctCount / questions.length) * 100);
    const passed = score >= quiz.passingScore;

    const attempt = DB.saveQuizAttempt({
      quizId: quiz.id,
      studentId: user.id,
      studentName: user.name,
      score,
      totalQuestions: questions.length,
      correctCount,
      passed,
      answers: quizUserAnswers
    });

    showToast(`Quiz submitted! Your score: ${score}%`, passed ? "success" : "warning");
    renderQuizResults(quiz, attempt);
  }

  function renderQuizResults(quiz, attempt) {
    const modal = document.getElementById("quiz-engine-modal");
    if (!modal) return;

    const questions = quiz.questions || [];

    const breakdownHtml = questions
      .map((q, idx) => {
        const userChoice = attempt.answers[q.id];
        const isCorrect = userChoice === q.correctIndex;

        return `
        <div class="p-4 rounded-xl border ${isCorrect ? 'border-emerald-300 dark:border-emerald-800 bg-emerald-50/40 dark:bg-emerald-950/20' : 'border-rose-300 dark:border-rose-800 bg-rose-50/40 dark:bg-rose-950/20'} space-y-2">
          <div class="flex items-center justify-between text-xs font-bold">
            <span class="${isCorrect ? 'text-emerald-600' : 'text-rose-600'}">Question ${idx + 1}: ${isCorrect ? '✓ Correct' : '✕ Incorrect'}</span>
          </div>
          <p class="text-xs font-bold text-[var(--text-main)]">${esc(q.question)}</p>
          <div class="text-[11px] space-y-1">
            <div>Your Answer: <span class="font-bold">${userChoice !== undefined ? esc(q.options[userChoice]) : 'No answer'}</span></div>
            ${!isCorrect ? `<div class="text-emerald-700 dark:text-emerald-400">Correct Answer: <span class="font-bold">${esc(q.options[q.correctIndex])}</span></div>` : ''}
          </div>
          <div class="text-[11px] text-slate-500 bg-white/70 dark:bg-slate-900/60 p-2.5 rounded-lg border border-[var(--border-color)]">

  function exportData() {
    const json = DB.exportDatabase();
    const blob = new Blob([json], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `edunova_backup_${Date.now()}.json`;
    a.click();
    showToast("Database exported successfully", "success");
  }

  function resetSeedData() {
    if (confirm("Reset database to original sample seed data? Current unsaved changes will be cleared.")) {
      DB.resetToSeed();
      showToast("Database reset to initial seed state", "success");
      setTimeout(() => location.reload(), 500);
    }
  }

  function handleCreateCourse(e) {
    e.preventDefault();
    const user = Auth.getCurrentUser();
    const title = document.getElementById("new-course-title").value;
    const category = document.getElementById("new-course-category").value;
    const description = document.getElementById("new-course-desc").value;
    const level = document.getElementById("new-course-level").value;
    const duration = document.getElementById("new-course-duration").value;

    const course = DB.createCourse({
      title,
      category,
      description,
      tagline: description.substring(0, 100),
      level,
      duration,
      instructorId: user ? user.id : "u-teacher-1",
      instructorName: user ? user.name : "Faculty Member",
      instructorAvatar: user ? user.avatar : "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=150&auto=format&fit=crop&q=80",
      instructorTitle: user ? user.title : "Instructor"
    });

    const ch = DB.addChapter(course.id, { title: "Introduction & Foundations" });
    DB.addLesson(course.id, ch.id, {
      title: "1.1 Course Orientation & Setup",
      duration: "15 min",
      description: "Welcome to the course! Overview of the toolchain, syllabus, and assignments."
    });

    document.getElementById("action-modal")?.classList.add("hidden");
    showToast("Course created successfully!", "success");
    navigate(`course-details/${course.id}`);
  }

            <button type="submit" class="btn-primary px-6 py-2 text-xs font-bold">Create Account</button>
          </div>
        </form>
      </div>
    `;
  }

  function handleCreateUser(e) {
    e.preventDefault();
    const name = document.getElementById("usr-name").value;
    const email = document.getElementById("usr-email").value;
    const password = document.getElementById("usr-pass").value;
    const role = document.getElementById("usr-role").value;
    const department = document.getElementById("usr-dept").value;

    try {
      DB.createUser({
        name,
        email,
        password,
        role,
        department,
        title: role === "teacher" ? "Faculty Instructor" : role === "admin" ? "Academic Director" : "Enrolled Student"
      });
      document.getElementById("action-modal")?.classList.add("hidden");
      showToast("User account created!", "success");
      renderUsers(document.getElementById("main-content"));
    } catch (err) {
      showToast(err.message, "error");
    }
  }

  function logout() {
    Auth.logout();
    showToast("Signed out successfully", "info");
    navigate("landing");
  }

  // Initialization
  function init() {
    initTheme();
    window.addEventListener("hashchange", handleRoute);
    window.addEventListener("edunova_auth_change", () => renderApp());
    handleRoute();
  }

  return {
    init,
    navigate,
    toggleTheme,
    quickSwitchRole,
    showToast,
    fillDemoLogin,
    handleLogin,
    handleRegister,
    filterByCategory,
    filterCoursesCatalog,
    handleEnrollCourse,
    renderCourseCardHtml,
    toggleLessonComplete,
    saveNoteAuto,
    switchLearnTab,
    postComment,
    upvoteComment,
    startQuiz,
    recordQuizAnswer,
    cancelQuiz,
    submitQuizAnswers,
    openCertificateModal,
    handleSaveProfile,
    exportData,
    resetSeedData,
    deleteUserConfirm,
    openCreateCourseModal,
    handleCreateCourse,
    openCreateAssignmentModal,
    handleCreateAssignment,
    openSubmitAssignmentModal,
    handleSubmitWork,
    openGradeSubmissionModal,
    handleGradeSubmission,
    openSubmissionsListModal,
    openCreateQuizModal,
    handleCreateQuiz,
    openCreateAnnouncementModal,
    handleCreateAnnouncement,
    openCreateBatchModal,
    handleCreateBatch,
    openCreateUserModal,
    handleCreateUser,
    toggleMobileSidebar,
    toggleNotificationsMenu,
    markAllRead,
    handleNotifClick,
    handleGlobalSearch,
    renderRoute,
    logout
  };
})();

// Bootstrap
document.addEventListener("DOMContentLoaded", () => {
  App.init();
});

  </script>
